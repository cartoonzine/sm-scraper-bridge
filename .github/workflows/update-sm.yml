name: Auto Update SM Lists

on:
  schedule:
    # Atualiza automaticamente a cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-sm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências e Chrome
        run: |
          npm install
          npx puppeteer browsers install chrome

      - name: Executar Scraper SM
        run: npm start

      - name: Limpar raiz e salvar na pasta listas/
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f *_sm*.json séries_sm.json --ignore-unmatch
          git add -A listas/*.json
          git diff --staged --quiet || (git commit -m "chore: listas atualizadas na pasta /listas" && git push)
