name: Auto Update SM Lists

on:
  schedule:
    # Atualiza automaticamente a cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-sm:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install --no-save axios

      - name: Executar Scraper SM
        run: npm start

      - name: Salvar listas na pasta /listas
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Garante que node_modules nunca vá para o GitHub
          printf "node_modules/\npackage-lock.json\n" > .gitignore
          git rm -r --cached node_modules --ignore-unmatch || true

          # Adiciona apenas o .gitignore e todos os JSONs da pasta listas/
          git add .gitignore listas/*.json

          # Faz commit e push com segurança
          if ! git diff --staged --quiet; then
            git commit -m "chore: atualização automática das listas em /listas"
            git pull --rebase --autostash origin main || true
            git push origin main
          else
            echo "Nenhuma alteração nas listas."
          fi
