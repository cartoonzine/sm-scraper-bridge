name: Auto Update SM Lists

on:
  schedule:
    # Atualiza automaticamente a cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-sm:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Executar Scraper SM
        run: npm start

      - name: Limpar node_modules do Git e salvar apenas /listas
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Garante que node_modules nunca seja rastreado
          printf "node_modules/\npackage-lock.json\n" > .gitignore

          # Remove node_modules do controle do Git caso ainda exista lá
          git rm -r --cached node_modules --ignore-unmatch || true

          # Remove arquivos JSON antigos soltos na raiz se existirem
          rm -f ./*_sm*.json ./séries_sm.json || true

          # Adiciona todas as atualizações (incluindo a pasta listas/)
          git add -A

          # Faz commit e push (com pull --rebase para evitar erro caso o repo tenha mudado durante os 6 min)
          if ! git diff --staged --quiet; then
            git commit -m "chore: atualização automática das listas em /listas"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "Nenhuma alteração nas listas."
          fi
