name: Auto Update SM Lists

on:
  schedule:
    # Atualiza automaticamente a cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-sm:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Executar Scraper SM
        run: npm start

      - name: Limpar node_modules do Git e salvar apenas /listas
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Cria .gitignore para nunca subir node_modules
          echo "node_modules/" > .gitignore
          echo "package-lock.json" >> .gitignore
          # Remove node_modules e JSONs antigos soltos na raiz caso tenham subido antes
          git rm -r --cached node_modules --ignore-unmatch
          git rm -f ./*_sm*.json ./séries_sm.json --ignore-unmatch
          # Adiciona o .gitignore e todos os JSONs da pasta listas/
          git add .gitignore listas/*.json
          git diff --staged --quiet || (git commit -m "chore: atualização automática das listas em /listas" && git push)
