name: Auto Update SM Lists

on:
  schedule:
    # Atualiza automaticamente a cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-sm:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências e Chrome
        run: |
          npm install
          npx puppeteer browsers install chrome

      - name: Executar Scraper SM
        run: npm start

      - name: Salvar todas as listas na pasta listas/
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Remove apenas JSONs soltos na raiz (sem tocar na pasta listas/)
          rm -f ./*_sm*.json ./séries_sm.json
          git add -A
          git diff --staged --quiet || (git commit -m "chore: listas completas atualizadas em /listas" && git push)
