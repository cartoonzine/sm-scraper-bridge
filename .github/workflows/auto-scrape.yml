name: Auto Scraper Saimo (Canais, Filmes, Séries, Animes e Doramas)

on:
  schedule:
    # Roda a cada 6 horas automaticamente
    - cron: '0 */6 * * *'
  workflow_dispatch: # Botão para rodar manualmente quando quiser

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências e navegador Headless
        run: |
          npm install
          npx puppeteer browsers install chrome

      - name: Executar Scraper (Canais + Filmes/Séries/Animes/Doramas)
        run: npm start

      - name: Commit e Push dos JSONs atualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json data/*.json || true
          git diff --staged --quiet || (git commit -m "chore(data): atualização automática das listas saimo" && git push)
